services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard
      POSTGRES_DB: taskboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      POSTGRES_DB: taskboard
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: dev-secret-change-me
      DEBUG: "true"
      EXPORTER_SERVICE_URL: http://exporter:9000
      EXPORTER_INTERNAL_TOKEN: dev-exporter-token

  exporter:
    build: ./exporter
    command: npm start
    volumes:
      - ./exporter:/app
      - exporter_node_modules:/app/node_modules
    ports:
      - "9000:9000"
    environment:
      PORT: "9000"
      EXPORTER_INTERNAL_TOKEN: dev-exporter-token
      AIRTABLE_API_KEY: ${AIRTABLE_API_KEY:-}
      AIRTABLE_BASE_ID: ${AIRTABLE_BASE_ID:-}
      AIRTABLE_TABLE_NAME: ${AIRTABLE_TABLE_NAME:-Tasks}

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      API_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
  exporter_node_modules:
